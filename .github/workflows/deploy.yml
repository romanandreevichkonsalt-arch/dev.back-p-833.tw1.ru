name: Deploy to FastPanel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SSH_HOST: 5.129.203.254
  SSH_USER: dev_back_p_8_usr
  SITE_DOMAIN: dev.back-p-833.tw1.ru

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        run: |
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='runtime/' --exclude='vendor/' --exclude='web/assets/' \
            -e "ssh -o StrictHostKeyChecking=no" \
            ./ "${SSH_USER}@${SSH_HOST}:~/data/repo/${SITE_DOMAIN}/"
          ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "bash ~/deploy/deploy-backend.sh '${SITE_DOMAIN}'"

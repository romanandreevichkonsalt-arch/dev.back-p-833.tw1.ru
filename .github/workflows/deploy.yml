name: Deploy to FastPanel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SSH_HOST: 5.129.203.254
  SSH_USER: dev_back_p_8_usr
  SITE_DOMAIN: dev.back-p-833.tw1.ru
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload and deploy
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/repo/${SITE_DOMAIN}"
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='runtime/' --exclude='vendor/' --exclude='web/assets/' \
            -e "$SSH_CMD" \
            ./ "${SSH_USER}@${SSH_HOST}:~/repo/${SITE_DOMAIN}/"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" \
            "bash ~/deploy/deploy-backend.sh '${SITE_DOMAIN}'"

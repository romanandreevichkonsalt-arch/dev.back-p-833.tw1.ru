name: Deploy to FastPanel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: true

env:
  SSH_HOST: 5.129.203.254
  SSH_USER: dev_back_p_8_usr
  SITE_DOMAIN: dev.back-p-833.tw1.ru
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Upload and deploy
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/repo/${SITE_DOMAIN}"
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='runtime/' --exclude='vendor/' --exclude='web/assets/' \
            --exclude='config/db.php' \
            -e "$SSH_CMD" \
            ./ "${SSH_USER}@${SSH_HOST}:~/repo/${SITE_DOMAIN}/"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" bash -s "${SITE_DOMAIN}" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$1"
          USER_HOME="${HOME}"
          WWW_ROOT="${USER_HOME}/www/${DOMAIN}"
          REPO_DIR="${USER_HOME}/repo/${DOMAIN}"
          cd "$REPO_DIR"
          export YII_ENV=prod
          export YII_DEBUG=0
          export COMPOSER_ALLOW_SUPERUSER=1
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            composer run-script post-install-cmd --no-interaction || true
          fi
          if [ -d "${REPO_DIR}/web" ]; then
            rm -rf "$WWW_ROOT"
            ln -sfn "${REPO_DIR}/web" "$WWW_ROOT"
          fi
          mkdir -p runtime web/assets
          chmod -R 775 runtime web/assets 2>/dev/null || true
          if [ -f yii ]; then
            php yii migrate --interactive=0
          fi
          echo "Backend deploy completed for ${DOMAIN}"
          REMOTE

name: Deploy to FastPanel

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  SSH_HOST: 5.129.203.254
  SSH_USER: dev_back_p_8_usr
  SITE_DOMAIN: dev.back-p-833.tw1.ru
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Install deploy script on server
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/deploy && cat > ~/deploy/deploy-backend.sh && chmod +x ~/deploy/deploy-backend.sh" <<'DEPLOY_SCRIPT'
          #!/bin/bash
          set -euo pipefail
          DOMAIN="${1:?Usage: deploy-backend.sh <domain>}"
          USER_HOME="/var/www/$(whoami)/data"
          WWW_ROOT="${USER_HOME}/www/${DOMAIN}"
          REPO_DIR="${USER_HOME}/repo/${DOMAIN}"
          if [ ! -d "$REPO_DIR" ]; then
            echo "ERROR: ${REPO_DIR} not found. Upload sources first."
            exit 1
          fi
          cd "$REPO_DIR"
          if [ -f composer.json ]; then
            composer install --no-dev --optimize-autoloader --no-interaction
          fi
          if [ -d "${REPO_DIR}/web" ]; then
            ln -sfn "${REPO_DIR}/web" "$WWW_ROOT"
          fi
          mkdir -p runtime web/assets 2>/dev/null || true
          chmod -R 775 runtime web/assets 2>/dev/null || true
          if [ -f yii ]; then
            php yii migrate --interactive=0 || echo "WARN: migration step finished with non-zero exit"
          fi
          echo "Backend deploy completed for ${DOMAIN}"
          DEPLOY_SCRIPT

      - name: Upload and deploy
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/repo/${SITE_DOMAIN}"
          rsync -az --delete \
            --exclude='.git' --exclude='.env' --exclude='.env.*' \
            --exclude='runtime/' --exclude='vendor/' --exclude='web/assets/' \
            -e "$SSH_CMD" \
            ./ "${SSH_USER}@${SSH_HOST}:~/repo/${SITE_DOMAIN}/"
          $SSH_CMD "${SSH_USER}@${SSH_HOST}" \
            "bash ~/deploy/deploy-backend.sh '${SITE_DOMAIN}'"
